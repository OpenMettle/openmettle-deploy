name: Restore drill
# V1-31 (openmettle-deploy#3): exercises an end-to-end isolated-target restore drill on an ephemeral
# kind cluster classified dev, using core images built from CORE_COMMIT and referenced by digest.
# Verifies backup manifest/checksum/schema/separate-key preflight, post-backup deletion/revocation
# journal replay and original expiry deadlines, surviving private ownership and 404/403 denials,
# unrecoverable payload declare-lost (410 Gone), quota/lease/operation/approval reconciliation with
# zero stale approval revival or blind external-effect replay, and RPO 24h / RTO 4h measurements.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - CORE_COMMIT
      - charts/openmettle-core/**
      - tests/kind/**
      - tests/chart/install-tools.sh
      - docs/restore-drill.md
      - .github/workflows/restore-drill.yml
  push:
    branches: [main]
    paths:
      - CORE_COMMIT
      - charts/openmettle-core/**
      - tests/kind/**
      - tests/chart/install-tools.sh
      - docs/restore-drill.md
      - .github/workflows/restore-drill.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  restore-drill:
    name: Isolated restore drill on ephemeral kind (dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; resolved 2026-11-14
        with:
          persist-credentials: false
      - name: Read pinned openmettle-core commit
        id: pin
        run: |
          core_commit=$(tr -d '\n' < CORE_COMMIT)
          [[ "$core_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'core_commit=%s\n' "$core_commit" >> "$GITHUB_OUTPUT"
          printf 'CORE_COMMIT=%s\n' "$core_commit" >> "$GITHUB_ENV"
      - name: Check out pinned openmettle-core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; resolved 2026-11-14
        with:
          repository: OpenMettle/openmettle-core
          ref: ${{ steps.pin.outputs.core_commit }}
          path: core-src
          persist-credentials: false
          fetch-depth: 0
      - name: Require the pinned core commit on core main
        run: |
          git -C core-src fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          git -C core-src merge-base --is-ancestor "$CORE_COMMIT" origin/main
      - name: Install pinned kind and kubectl from core (SHA-256 verified)
        run: bash core-src/tests/kubernetes/install-tools.sh "$RUNNER_TEMP/k8s-tools"
      - name: Install pinned Helm (SHA-256 verified)
        run: bash tests/chart/install-tools.sh "$RUNNER_TEMP/chart-tools"
      - name: Harness unit tests with imported core guards (no cluster)
        env:
          OPENMETTLE_CORE_DIR: core-src
          HELM: ${{ runner.temp }}/chart-tools/helm
        run: python3 -m unittest discover -s tests/kind -v
      - name: Run isolated-target restore drill on ephemeral kind
        env:
          OPENMETTLE_K8S_QUALIFICATION: isolated-dev
          OPENMETTLE_K8S_DOCKER_CONTEXT: default
        run: >-
          python3 tests/kind/restore_drill.py
          --core-dir core-src
          --tools-dir "$RUNNER_TEMP/k8s-tools"
          --helm-dir "$RUNNER_TEMP/chart-tools"
          --report "$RUNNER_TEMP/restore-drill.json"
      - name: Publish the non-secret summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/restore-drill.json" ]; then
            { echo '```json'; cat "$RUNNER_TEMP/restore-drill.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
