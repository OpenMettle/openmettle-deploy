name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; resolved 2026-11-14
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: python3 scripts/check_repository.py

  render:
    # V1-32 I1: render contract only. Nothing is installed on a cluster, pushed or published.
    name: Chart render contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; resolved 2026-11-14
        with:
          persist-credentials: false
      - name: Read pinned openmettle-core commit
        run: |
          core_commit=$(tr -d '\n' < CORE_COMMIT)
          [[ "$core_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'CORE_COMMIT=%s\n' "$core_commit" >> "$GITHUB_ENV"
      - name: Lint shell scripts
        run: shellcheck tests/chart/install-tools.sh tests/chart/render.sh
      - name: Install pinned Helm and kubeconform (SHA-256 verified)
        run: |
          bash tests/chart/install-tools.sh "$RUNNER_TEMP/chart-tools"
          echo "$RUNNER_TEMP/chart-tools" >> "$GITHUB_PATH"
      - name: Install test-only PyYAML (hash pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check --require-hashes \
            --only-binary :all: --no-deps -r tests/chart/requirements.txt
      - name: Lint, render matrix and kubeconform
        run: bash tests/chart/render.sh
      - name: Policy, negative-case and contract tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/chart -v
      - name: Verify core contract fixture against the pinned commit
        run: |
          fixture="tests/fixtures/core/process-contract.json"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/process-contract.json" \
            "https://raw.githubusercontent.com/OpenMettle/openmettle-core/$CORE_COMMIT/runtime/process-contract.json"
          cmp "$RUNNER_TEMP/process-contract.json" "$fixture"
      - name: Kind smoke harness tests (no cluster), with core guards from the pinned commit
        # The cluster run itself is kind-smoke.yml (path-filtered pull requests and main, and dispatch).
        run: |
          mkdir -p "$RUNNER_TEMP/core/tests/kubernetes" "$RUNNER_TEMP/core/contracts/telemetry"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/core/tests/kubernetes/qualify.py" \
            "https://raw.githubusercontent.com/OpenMettle/openmettle-core/$CORE_COMMIT/tests/kubernetes/qualify.py"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/core/contracts/telemetry/v1.json" \
            "https://raw.githubusercontent.com/OpenMettle/openmettle-core/$CORE_COMMIT/contracts/telemetry/v1.json"
          OPENMETTLE_CORE_DIR="$RUNNER_TEMP/core" python3 -m unittest discover -s tests/kind -v
