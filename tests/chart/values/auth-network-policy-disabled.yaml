# Synthetic overlay on minimal.yaml: browser sign-in / OIDC enabled without the chart's
# NetworkPolicies, so networkPolicy.api.oidc.to is not required.
database:
  issuance:
    existingSecret: openmettle-issuance-database
networkPolicy:
  enabled: false
  database:
    to: []
auth:
  enabled: true
  configMapName: example-auth-config
  loginKeysSecretName: example-auth-login-keys
