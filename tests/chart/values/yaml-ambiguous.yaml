# Synthetic overlay on minimal.yaml: schema-valid names that YAML would read as an integer,
# boolean or null if a template emitted them unquoted. Render with the release name "123".
images:
  pullSecrets: ["true"]
database:
  api:
    existingSecret: "456"
    key: "123"
  worker:
    key: "false"
  migrate:
    key: "null"
api:
  serviceAccount:
    name: "555"
worker:
  serviceAccount:
    create: false
    name: "true"
migration:
  serviceAccount:
    name: "null"
networkPolicy:
  api:
    oidc:
      to:
        - podSelector:
            matchLabels:
              example.test/oidc: "true"
              example.test/id: "456"
  database:
    to:
      - podSelector:
          matchLabels:
            example.test/enabled: "true"
            example.test/id: "123"
  telemetry:
    otlp:
      to:
        - podSelector:
            matchLabels:
              example.test/otlp: "true"
              example.test/id: "789"
auth:
  enabled: true
  configMapName: "789"
  configKey: "false"
  loginKeysSecretName: "null"
  providerCaBundle:
    enabled: true
    configMapName: "123"
    key: "true"
telemetry:
  logging:
    format: json
    level: warn
  otlp:
    enabled: true
    tracesEndpoint: https://alloy.observability.example.test:4318/v1/traces
    metricsEndpoint: https://alloy.observability.example.test:4318/v1/metrics
    privateRanges:
      - 10.43.0.0/16
    caBundle:
      enabled: true
      configMapName: "321"
      key: "false"
