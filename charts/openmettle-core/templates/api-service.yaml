{{- $context := dict "root" . "component" "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmettle-core.fullname" . }}-api
  labels:
    {{- include "openmettle-core.labels" $context | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "openmettle-core.selectorLabels" $context | nindent 4 }}
  ports:
    - name: http
      port: {{ int64 .Values.api.service.port }}
      targetPort: http
      protocol: TCP
