{{- /*
NetworkPolicies (design §5). A deny-all policy selects every pod of this release; per-component
policies then allow DNS and database egress, and API ingress from configured peers only.
NetworkPolicies are additive and select pods by label, so the allows below are the release's whole
reachability. They take effect only where the cluster's network plugin enforces NetworkPolicy.

The migrate policy is a hook at a lower weight than the Job, like the migrate ServiceAccount: hooks
run before ordinary resources, so on first install neither the deny-all nor any allow exists yet.
Without its own hook policy, the migrate pod would have no egress in a namespace that denies by
default, and on upgrade the release's deny-all would block it.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $workerExtraEgress := list }}
{{- if default false (get (default dict .Values.worker.inference) "enabled") }}
{{- $workerExtraEgress = append $workerExtraEgress .Values.networkPolicy.worker.inference }}
{{- end }}
{{- if default false (get (default dict .Values.worker.mcp) "enabled") }}
{{- $workerExtraEgress = append $workerExtraEgress .Values.networkPolicy.worker.mcp }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openmettle-core.fullname" . }}-deny-all
  labels:
    {{- include "openmettle-core.labels" (dict "root" . "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openmettle-core.releaseSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
{{ include "openmettle-core.networkPolicy" (dict "root" . "component" "api" "ingressFrom" .Values.networkPolicy.api.ingressFrom "port" 8080 "oidc" .Values.auth.enabled "otlp" .Values.telemetry.otlp.enabled) }}
---
{{ include "openmettle-core.networkPolicy" (dict "root" . "component" "worker" "otlp" .Values.telemetry.otlp.enabled "extraEgress" $workerExtraEgress) }}
{{- if .Values.migration.enabled }}
---
{{ include "openmettle-core.networkPolicy" (dict "root" . "component" "migrate" "annotations" (dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded")) }}
{{- end }}
{{- if default false (get (default dict .Values.backup) "enabled") }}
---
{{ include "openmettle-core.networkPolicy" (dict "root" . "component" "backup") }}
{{- end }}
{{- range $name := keys (default dict .Values.gateways) | sortAlpha }}
{{- $g := dict }}
{{- include "openmettle-core.resolveGateway" (dict "name" $name "raw" (index $.Values.gateways $name) "out" $g) }}
{{- $workerPeer := list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (include "openmettle-core.name" $) "app.kubernetes.io/instance" (toString $.Release.Name) "app.kubernetes.io/component" "worker"))) }}
{{- $ingressFrom := $g.networkPolicy.ingressFrom }}
{{- if kindIs "invalid" $ingressFrom }}
{{- $ingressFrom = $workerPeer }}
{{- end }}
---
{{ include "openmettle-core.networkPolicy" (dict "root" $ "component" (printf "gateway-%s" $name) "ingressFrom" $ingressFrom "port" 8082 "otlp" $.Values.telemetry.otlp.enabled "extraEgress" (list $g.networkPolicy.upstream)) }}
{{- end }}
{{- end }}
