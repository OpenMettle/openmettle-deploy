{{- /* One ServiceAccount per component. The processes never call the Kubernetes API, so no token is mounted and no RBAC is created. */ -}}
{{- range $component := list "api" "worker" }}
{{- $serviceAccount := (index $.Values $component).serviceAccount }}
{{- if $serviceAccount.create }}
{{- $context := dict "root" $ "component" $component "serviceAccount" $serviceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openmettle-core.serviceAccountName" $context | quote }}
  labels:
    {{- include "openmettle-core.labels" $context | nindent 4 }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- range $name := keys (default dict $.Values.gateways) | sortAlpha }}
{{- $g := dict }}
{{- include "openmettle-core.resolveGateway" (dict "name" $name "raw" (index $.Values.gateways $name) "out" $g) }}
{{- $serviceAccount := $g.serviceAccount }}
{{- if $serviceAccount.create }}
{{- $context := dict "root" $ "component" (printf "gateway-%s" $name) "field" (printf "gateways.%s" $name) "serviceAccount" $serviceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openmettle-core.serviceAccountName" $context | quote }}
  labels:
    {{- include "openmettle-core.labels" $context | nindent 4 }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
