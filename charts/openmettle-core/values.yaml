# OpenMettle core chart values. values.schema.json rejects unknown keys at every level.
# The chart refuses to render until every image digest and database Secret name is supplied.
# Keep site values in a private overlay (`-f <private>.yaml`), never in this repository.

images:
  pullPolicy: IfNotPresent
  # Names of existing image pull Secrets in the release namespace.
  pullSecrets: []
  # Each image renders as [registry/]repository@digest; tags are not accepted.
  api:
    registry: ""
    repository: ""
    digest: ""
  worker:
    registry: ""
    repository: ""
    digest: ""
  migrate:
    registry: ""
    repository: ""
    digest: ""
  # Required (repository and digest) while gateways is non-empty; must stay empty while gateways is {}.
  gateway:
    registry: ""
    repository: ""
    digest: ""

database:
  # Existing Secrets holding a full postgres:// URL, including an explicit sslmode.
  # The chart never creates or reads Secrets. Each process gets its own login role.
  api:
    existingSecret: ""
    key: url
  worker:
    existingSecret: ""
    key: url
  # Owner (openmettle_owner) URL; mounted only into the migration Job.
  migrate:
    existingSecret: ""
    key: url
  # Session issuance URL (a login role of openmettle_issuance, core ADR 0030), mounted into the API
  # container only. Required while auth.enabled is true and refused while it is false. It must not
  # be the same Secret key as api, worker or migrate: core refuses an issuance URL whose user is the
  # API's, and the worker and migrator refuse to start if they receive it.
  issuance:
    existingSecret: ""
    key: url
  # Gateway proxy URL (a login role of openmettle_gateway, core ADR 0044), mounted into
  # openmettle-gateway pods only. Required while gateways is non-empty and refused while it is empty.
  # Must not reuse the Secret key of api, worker, migrate or (when auth.enabled) issuance.
  gateway:
    existingSecret: ""
    key: url
  # Optional PostgreSQL connections available to this release. When set, rendering fails if
  # (api.replicas + api.maxSurge) * (api.dbMaxConnections + api.issuanceDbMaxConnections if auth.enabled)
  #   + (worker.replicas + worker.maxSurge) * worker.dbMaxConnections
  #   + sum_gateways((g.replicas + g.maxSurge) * g.dbMaxConnections) + 1 (migrator) exceeds it.
  connectionBudget: null
  # Optional CA bundle for verifying PostgreSQL server certificates. When enabled, one key of an
  # existing ConfigMap (the chart never creates ConfigMaps or Secrets) is mounted read-only at
  # /etc/openmettle/db-ca/ca.crt in api, worker, migrate and (when configured) gateway pods. No
  # environment variable is set: reference the file in each URL:
  # ?sslmode=verify-full&sslrootcert=/etc/openmettle/db-ca/ca.crt
  caBundle:
    enabled: false
    configMapName: ""
    key: ca.crt

api:
  replicas: 1
  # Example requests from core runtime/process-contract.json; not qualified sizing.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
  serviceAccount:
    create: true
    # Defaults to <fullname>-api. Required when create is false.
    name: ""
    annotations: {}
  # OPENMETTLE_API_* settings; bounds match core src/lib.rs.
  settings:
    dbMaxConnections: 4
    dbTimeoutMs: 2000
    shutdownTimeoutMs: 5000
    # Session issuance pool size (1-64), rendered only while auth.enabled is true (core ADR 0030).
    issuanceDbMaxConnections: 2
  # Must exceed settings.shutdownTimeoutMs; rendering fails otherwise.
  terminationGracePeriodSeconds: 15
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  service:
    port: 8080
  # Optional PodDisruptionBudget for the API. Off by default so a single-replica install never
  # blocks node drains. When enabled, set exactly one of minAvailable or maxUnavailable (an integer
  # or a percentage such as "50%"). Rendering fails unless api.replicas >= 2 and the budget still
  # allows at least one voluntary eviction.
  podDisruptionBudget:
    enabled: false
    minAvailable: null
    maxUnavailable: null
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicas: 1
  # Optional maintenance sweep interval in milliseconds (core ADR 0033), 1000–3600000.
  sweepMs: null
  # Optional run-claim polling interval in milliseconds (core ADR 0033), 100–60000.
  pollMs: null
  # Optional turn execution against openmettle-gateway (core ADRs 0033, 0043 and 0044).
  # Off by default: when false, no inference config, CA bundle or run-claim settings are rendered,
  # and the worker runs maintenance sweeps only.
  inference:
    enabled: false
    # Existing ConfigMap holding the inference document (configKey) and model catalog (catalogKey),
    # projected read-only at /etc/openmettle/inference/{inference.json,catalog.json} on worker only.
    # Required while enabled is true; must stay empty while enabled is false.
    configMapName: ""
    configKey: inference.json
    catalogKey: catalog.json
    # OPENMETTLE_WORKER_* turn-execution settings (core src/lib.rs); rendered only while enabled.
    settings:
      runSlots: 4
      leaseMs: 60000
      executionTimeoutMs: 300000
      executingPerActor: 2
      executingPerScope: 4
    # Optional CA bundle for verifying private/cluster-CA TLS terminators in front of
    # openmettle-gateway. Mounted read-only at /etc/openmettle/inference-ca/ca.crt on worker only.
    caBundle:
      enabled: false
      configMapName: ""
      key: ca.crt
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # OPENMETTLE_WORKER_* settings; bounds match core src/lib.rs.
  settings:
    dbMaxConnections: 4
    dbTimeoutMs: 2000
    shutdownTimeoutMs: 5000
  terminationGracePeriodSeconds: 15
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

migration:
  # Runs openmettle-migrate as a pre-install/pre-upgrade hook. Set false to run it out of band.
  enabled: true
  # OPENMETTLE_MIGRATE_* settings; defaults and bounds match core src/migrate.rs.
  settings:
    connectTimeoutMs: 5000
    lockTimeoutMs: 15000
    statementTimeoutMs: 300000
  # Job deadline in seconds. Must exceed connectTimeoutMs + lockTimeoutMs + statementTimeoutMs;
  # rendering fails otherwise. Give Helm a --timeout of at least this value (see README).
  activeDeadlineSeconds: 900
  resources: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Scheduling for the hook pod, for example to tolerate the same taints as api and worker.
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  # A deny-all NetworkPolicy for every pod of this release, plus the allows below. Policies take
  # effect only if the cluster's network plugin enforces NetworkPolicy (see README).
  enabled: true
  api:
    # Peers (Kubernetes NetworkPolicyPeer) that may connect to the API on TCP 8080, for example an
    # ingress controller. Empty: no pod may connect. Kubelet probes come from the node, not a peer.
    ingressFrom: []
    oidc:
      # Required when auth.enabled and networkPolicy.enabled are true: OIDC provider peers that the
      # API (and never worker or migrate) may reach on `port`. Must stay empty while auth.enabled is
      # false so unused egress is never opened.
      to: []
      port: 443
  worker:
    inference:
      # Required when worker.inference.enabled and networkPolicy.enabled are true: inference
      # gateway or external TLS-terminator peers that worker (and never api, gateway or migrate)
      # may reach on `port` (default 8082). Must stay empty while worker.inference.enabled is false.
      to: []
      port: 8082
  dns:
    # Peers that every component may query on UDP and TCP 53. The default matches the CoreDNS pods
    # of kubeadm (kind) and K3s. Rendering fails if this is empty while enabled.
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  database:
    # Required when enabled: the PostgreSQL peers that api, worker and migrate may reach on `port`.
    # Rendering fails if this is empty while enabled, because an empty list would allow any destination.
    to: []
    port: 5432
  telemetry:
    otlp:
      # Required when telemetry.otlp.enabled and networkPolicy.enabled are true: OTLP collector
      # peers that api, worker and (when configured) gateway pods (never migrate) may reach on TCP
      # `port` (default 4318). Must stay empty while telemetry.otlp.enabled is false so unused egress
      # is never opened.
      to: []
      port: 4318

storage:
  # Optional artifact volume, mounted read-write at /var/lib/openmettle/artifacts in api and worker
  # pods (never in the migration Job), passed to both as OPENMETTLE_{API,WORKER}_ARTIFACTS_DIR
  # (core ADR 0031); see README. When enabled, set exactly one of existingClaim or size.
  artifacts:
    enabled: false
    # Name of an existing PersistentVolumeClaim in the release namespace; the chart renders no PVC.
    existingClaim: ""
    # Size of a chart-owned PVC <fullname>-artifacts. Helm keeps it on uninstall (resource-policy).
    size: ""
    # Chart-owned PVC only. ReadWriteOnce needs api and worker on one node; use ReadWriteMany otherwise.
    accessModes: [ReadWriteOnce]
    # Chart-owned PVC only. null: the cluster's default StorageClass. "": no class (static binding).
    storageClassName: null
    # Chart-owned PVC only.
    annotations: {}

ingress:
  # Optional networking.k8s.io/v1 Ingress for the API Service. Before enabling it, configure the
  # ingress controller so that its logs and traces never record request targets (paths and query
  # strings), cookies or request bodies (see README "Ingress and TLS"). Rendering fails unless
  # className is set, tls covers every host and, while networkPolicy.enabled is true,
  # networkPolicy.api.ingressFrom lists the ingress controller.
  enabled: false
  className: ""
  annotations: {}
  # Dedicated application hostnames (lowercase DNS names; no wildcard or IP address). Every path is
  # routed to the API Service unmodified (path "/", pathType Prefix).
  hosts: []
  # Existing TLS Secrets ({secretName, hosts}); the chart never creates Secrets.
  tls: []

auth:
  # Optional sign-in / OIDC and /v1/* application route configuration mounted into the API pod only
  # (core ADRs 0025, 0027 and 0029). Off by default: when false, OPENMETTLE_API_AUTH_CONFIG is unset,
  # no auth files are mounted and the API answers 404 on every sign-in and /v1/* path.
  # The chart never creates ConfigMaps or Secrets, and never mounts auth config, login keys or the
  # provider CA into worker or migrate pods.
  enabled: false
  # Existing ConfigMap holding a version-2 auth settings document (core ADR 0020). Projected
  # read-only at /etc/openmettle/auth/auth.json and passed via OPENMETTLE_API_AUTH_CONFIG.
  configMapName: ""
  configKey: auth.json
  # Optional second key of the same ConfigMap holding the model catalog (core ADRs 0032 and 0036).
  # When set, it is projected read-only beside auth.json at /etc/openmettle/auth/catalog.json; name
  # that path as catalog_file in auth.json. Empty: no catalog file is mounted. Must differ from
  # configKey and must stay empty while auth.enabled is false.
  catalogKey: ""
  # Existing Secret holding raw 32-byte login key files referenced by the auth document. Mounted
  # read-only at /etc/openmettle/auth-keys (mode 0440, pod fsGroup 65532) in the API pod only.
  # cursor_keys in auth.json can reference 32-byte raw files in the same Secret. Use
  # separate IDs and key material for cursor_keys and login.keys (core ADRs 0015 and 0034).
  loginKeysSecretName: ""
  # Optional CA bundle for verifying private/cluster-CA OIDC providers (for example in-cluster
  # Keycloak). When enabled, one key of an existing ConfigMap is mounted read-only at
  # /etc/openmettle/auth-ca/ca.crt in the API pod only. Reference it via providers[].trust:
  # {"roots": "bundle", "bundle_path": "/etc/openmettle/auth-ca/ca.crt"}.
  providerCaBundle:
    enabled: false
    configMapName: ""
    key: ca.crt

telemetry:
  logging:
    # Optional OPENMETTLE_<ROLE>_LOG_FORMAT ("json" or "text") and OPENMETTLE_<ROLE>_LOG_LEVEL
    # ("error", "warn", "info", or "debug"; "trace" is intentionally refused by core ADR 0024).
    # When null/unset, no LOG_* env vars are emitted and core uses its defaults (json / info).
    format: null
    level: null
  otlp:
    # Optional OTLP/HTTP protobuf trace and/or metrics export for api, worker and (when configured)
    # gateway pods (never migrate; core ADRs 0026 and 0028). Off by default: when false, no OTLP_*
    # env vars, CA mounts or collector egress are rendered. openmettle-migrate is stderr-only and
    # never receives OTLP settings, CA mounts or egress.
    enabled: false
    # At least one of tracesEndpoint or metricsEndpoint is required when enabled (both must stay
    # empty while disabled): canonical HTTPS URL with a DNS host (no http://, no IP literal,
    # numeric/hex final host label, credentials, query, fragment or default port :443).
    # Non-empty values render OPENMETTLE_{API,WORKER,GATEWAY}_OTLP_{TRACES,METRICS}_ENDPOINT.
    tracesEndpoint: ""
    metricsEndpoint: ""
    # Optional list of up to 32 unique canonical private CIDR strings (RFC 1918, CGNAT or ULA)
    # joined with commas into OPENMETTLE_{API,WORKER,GATEWAY}_OTLP_PRIVATE_RANGES when non-empty.
    # Must stay empty while telemetry.otlp.enabled is false.
    privateRanges: []
    # Optional CA bundle for verifying private/cluster-CA OTLP collectors (e.g. in-cluster Alloy).
    # Existing ConfigMap key mounted read-only at sibling directory /etc/openmettle/otlp-ca/ca.crt
    # in api, worker and gateway pods only (never migrate), setting OPENMETTLE_*_OTLP_CA_FILE.
    # The chart never creates ConfigMaps or Secrets. Must stay disabled when telemetry.otlp.enabled is false.
    caBundle:
      enabled: false
      configMapName: ""
      key: ca.crt

# Optional per-model openmettle-gateway instances (core ADR 0044), keyed by DNS-1123 instance name
# (<name> matching ^[a-z0-9]([-a-z0-9]{0,30}[a-z0-9])?$; <fullname>-gateway-<name> <= 63 chars).
# Empty by default: when empty, no gateway Deployment, Service, ServiceAccount or NetworkPolicy is
# rendered, and images.gateway and database.gateway.existingSecret must stay empty.
# Each entry requires `model` (1-128 bytes, distinct across gateways) and `upstreamUrl` (canonical
# http://host[:port] origin), and defaults to:
#   replicas: 1
#   resources: {requests: {cpu: 100m, memory: 64Mi}}
#   serviceAccount: {create: true, name: "", annotations: {}}
#   settings:
#     cacheMode: scoped
#     upstreamConnectTimeoutMs: 5000
#     upstreamIdleTimeoutMs: 120000
#     dbMaxConnections: 4
#     dbTimeoutMs: 2000
#     shutdownTimeoutMs: 5000
#   terminationGracePeriodSeconds: 15
#   strategy: {maxSurge: 1, maxUnavailable: 0}
#   service: {port: 8082}
#   networkPolicy:
#     ingressFrom: null              # null: this release's worker pods only; list: explicit peers
#     upstream: {to: [], port: 30000}
#   podAnnotations: {}
#   nodeSelector: {}
#   tolerations: []
#   affinity: {}
gateways: {}
