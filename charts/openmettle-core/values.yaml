# OpenMettle core chart values. values.schema.json rejects unknown keys at every level.
# The chart refuses to render until every image digest and database Secret name is supplied.
# Keep site values in a private overlay (`-f <private>.yaml`), never in this repository.

images:
  pullPolicy: IfNotPresent
  # Names of existing image pull Secrets in the release namespace.
  pullSecrets: []
  # Each image renders as [registry/]repository@digest; tags are not accepted.
  api:
    registry: ""
    repository: ""
    digest: ""
  worker:
    registry: ""
    repository: ""
    digest: ""
  migrate:
    registry: ""
    repository: ""
    digest: ""

database:
  # Existing Secrets holding a full postgres:// URL, including an explicit sslmode.
  # The chart never creates or reads Secrets. Each process gets its own login role.
  api:
    existingSecret: ""
    key: url
  worker:
    existingSecret: ""
    key: url
  # Owner (openmettle_owner) URL; mounted only into the migration Job.
  migrate:
    existingSecret: ""
    key: url
  # Optional PostgreSQL connections available to this release. When set, rendering fails if
  # (api.replicas + api.maxSurge) * api.dbMaxConnections
  #   + (worker.replicas + worker.maxSurge) * worker.dbMaxConnections + 1 (migrator) exceeds it.
  connectionBudget: null

api:
  replicas: 1
  # Example requests from core runtime/process-contract.json; not qualified sizing.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
  serviceAccount:
    create: true
    # Defaults to <fullname>-api. Required when create is false.
    name: ""
    annotations: {}
  # OPENMETTLE_API_* settings; bounds match core src/lib.rs.
  settings:
    dbMaxConnections: 4
    dbTimeoutMs: 2000
    shutdownTimeoutMs: 5000
  # Must exceed settings.shutdownTimeoutMs; rendering fails otherwise.
  terminationGracePeriodSeconds: 15
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  service:
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # OPENMETTLE_WORKER_* settings; bounds match core src/lib.rs.
  settings:
    dbMaxConnections: 4
    dbTimeoutMs: 2000
    shutdownTimeoutMs: 5000
  terminationGracePeriodSeconds: 15
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

migration:
  # Runs openmettle-migrate as a pre-install/pre-upgrade hook. Set false to run it out of band.
  enabled: true
  # OPENMETTLE_MIGRATE_* settings; defaults and bounds match core src/migrate.rs.
  settings:
    connectTimeoutMs: 5000
    lockTimeoutMs: 15000
    statementTimeoutMs: 300000
  # Job deadline in seconds. Must exceed connectTimeoutMs + lockTimeoutMs + statementTimeoutMs;
  # rendering fails otherwise. Give Helm a --timeout of at least this value (see README).
  activeDeadlineSeconds: 900
  resources: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Scheduling for the hook pod, for example to tolerate the same taints as api and worker.
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  # A deny-all NetworkPolicy for every pod of this release, plus the allows below. Policies take
  # effect only if the cluster's network plugin enforces NetworkPolicy (see README).
  enabled: true
  api:
    # Peers (Kubernetes NetworkPolicyPeer) that may connect to the API on TCP 8080, for example an
    # ingress controller. Empty: no pod may connect. Kubelet probes come from the node, not a peer.
    ingressFrom: []
  dns:
    # Peers that every component may query on UDP and TCP 53. The default matches the CoreDNS pods
    # of kubeadm (kind) and K3s. Rendering fails if this is empty while enabled.
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  database:
    # Required when enabled: the PostgreSQL peers that api, worker and migrate may reach on `port`.
    # Rendering fails if this is empty while enabled, because an empty list would allow any destination.
    to: []
    port: 5432
